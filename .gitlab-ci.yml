# GitLab CI for the weather-sampler submission.
#
# Mirrors the project's previous GitHub Actions workflow (the repo is hosted and
# assessed on GitLab, where GitHub Actions never runs): install the pinned
# dependencies, attempt the optional spherical-harmonic extra, lint, then run the
# pytest suite. A single job, matching the single-job GitHub workflow.
#
# Python 3.11 matches the assessed environment; pyproject requires >= 3.10.

test:
  image: python:3.11
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    # Optional ducc0 (spectrum diagnostic) has no wheel on some platforms and
    # builds from source; keep it non-blocking, exactly as the GitHub workflow's
    # continue-on-error did. The spectrum tests skip if it fails to install.
    - python -m pip install -e '.[spectral]' || true
    - python -m pip install ruff
    # Lint is advisory, not a gate (mirrors continue-on-error on the ruff step).
    - ruff check . || true
    - python -m pytest -q
