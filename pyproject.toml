[project]
name = "weather-sampler-research"
version = "0.1.0"
description = "Research code and diagnostics for WeatherGenerator sampler experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
plots = [
    "matplotlib>=3.8",
    "pyshp>=3.0",
]
notebooks = [
    "ipykernel>=6",
    "matplotlib>=3.8",
    "pyshp>=3.0",
]
real = [
    "torch",
]
# Optional accelerator for the native O96 angular power spectrum
# (diagnostics.sampled_spherical_power_spectrum, engine="ducc0"). The pure-numpy
# "native" engine is the default and needs no extra dependency; ducc0 is faster
# but is not pre-built for every platform (e.g. no aarch64 wheel -> source build
# requiring a recent C++ toolchain + Python dev headers).
spectrum = [
    "ducc0>=0.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "sampler_research/src"

[tool.setuptools.packages.find]
where = ["sampler_research/src"]

[tool.pytest.ini_options]
testpaths = ["sampler_research/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Conservative starter set: pycodestyle errors, pyflakes, import sorting.
# Note: __init__.py re-exports rely on __all__ (ruff honours it); review any
# import reorder before committing and do not blind-`--fix` F401.
select = ["E", "F", "I"]
