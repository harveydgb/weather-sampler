[project]
name = "weather-sampler"
version = "0.1.0"
description = "Research code and diagnostics for WeatherGenerator sampler experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
plots = [
    "matplotlib>=3.8",
    "pyshp>=3.0",
]
notebooks = [
    "ipykernel>=6",
    "matplotlib>=3.8",
    "pyshp>=3.0",
]
real = [
    "torch",
]
spectral = [
    # Spherical-harmonic transform for the O96 angular power-spectrum diagnostic.
    # Optional so the core install never needs a C++ toolchain where no wheel exists.
    "ducc0>=0.41",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Conservative starter set: pycodestyle errors, pyflakes, import sorting.
# Note: __init__.py re-exports rely on __all__ (ruff honours it); review any
# import reorder before committing and do not blind-`--fix` F401.
select = ["E", "F", "I"]
